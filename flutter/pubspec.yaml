name: hyperbabel_demo
description: "A comprehensive Flutter demo for the HyperBabel API Platform — Customer Auth pattern B1 (Firebase Direct Exchange)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # ── HyperBabel: HTTP + real-time + RTC ────────────────────────────────
  dio: ^5.7.0
  ably_flutter: ^1.2.44
  # 6.6.x downgrades transitive ffi to 1.x which conflicts with
  # flutter_local_notifications 18.x. Keep 6.5 until both upstreams align.
  agora_rtc_engine: ^6.5.3

  # ── Auth (Customer Auth pattern B1) ───────────────────────────────────
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.5
  flutter_secure_storage: ^9.2.2

  # ── State / nav / config ──────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  shared_preferences: ^2.3.3
  flutter_dotenv: ^5.2.1

  # ── UI / utilities ────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  gap: ^3.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hyperbabel.png

# .env is NOT registered as an asset. flutter_dotenv loads it via try/catch
# in main.dart — missing .env is tolerated (defaults apply). If you do
# create one (`cp .env.example .env`), it will be picked up at next run as
# long as you add `- .env` to the assets list above.
